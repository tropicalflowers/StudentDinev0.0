<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Operations - Student Dine Portal</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { background: var(--bg); color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .ops-wrap { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .ops-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .ops-head h1 { margin: 0; font-size: 30px; }
    .ops-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .ops-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--card); border: 1px solid color-mix(in srgb, var(--txt) 12%, transparent); border-radius: 8px; padding: 18px; }
    .panel h2 { margin: 0 0 14px; font-size: 18px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn { border: 0; border-radius: 8px; padding: 10px 13px; color: white; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, var(--pri), var(--pri-2)); }
    .btn.secondary { background: transparent; color: var(--txt); border: 1px solid color-mix(in srgb, var(--txt) 18%, transparent); }
    .btn.danger { background: #dc2626; }
    .btn.small { padding: 7px 9px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid color-mix(in srgb, var(--txt) 10%, transparent); text-align: left; font-size: 13px; vertical-align: top; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid color-mix(in srgb, var(--txt) 14%, transparent); border-radius: 8px; background: transparent; color: var(--txt); outline: none; }
    textarea { min-height: 70px; resize: vertical; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .status { display: inline-flex; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 800; }
    .status.open { background: color-mix(in srgb, #10b981 18%, transparent); color: #10b981; }
    .status.closed { background: color-mix(in srgb, #ef4444 18%, transparent); color: #ef4444; }
    .muted { color: var(--muted); }
    .message { min-height: 20px; margin: 8px 0 0; font-size: 13px; color: var(--accent); }
    @media (max-width: 1000px) { .ops-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .ops-wrap { padding: 14px; } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="row">
      <div class="brand"><div class="logo"></div><div>Student Dine Portal - Manager</div></div>
      <div class="menu">
        <button onclick="Auth.logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="ops-wrap">
    <div class="ops-head">
      <div>
        <h1>Manager Operations</h1>
        <p class="muted">Restaurants, menu items, staff, and mess activity are saved in MongoDB.</p>
      </div>
      <div class="ops-actions">
        <button class="btn" onclick="refreshAll()">Refresh Data</button>
      </div>
    </div>

    <div class="ops-grid">
      <section class="panel">
        <h2>Restaurants</h2>
        <div class="toolbar">
          <select id="restaurantSelect"></select>
          <button class="btn small secondary" onclick="createRestaurant()">New</button>
          <button class="btn small" onclick="toggleRestaurant()">Open / Close</button>
          <button class="btn small secondary" onclick="deleteRestaurant()">Delete</button>
        </div>
        <div id="restaurantTable"></div>
        <p class="message" id="restaurantMessage"></p>
      </section>

      <section class="panel">
        <h2>Restaurant Details</h2>
        <div class="form-grid">
          <label>Name <input id="restaurantName" /></label>
          <label>Cluster <input id="restaurantCluster" /></label>
          <label>Phone <input id="restaurantPhone" /></label>
          <label>Email <input id="restaurantEmail" /></label>
          <label class="full">Address <textarea id="restaurantAddress"></textarea></label>
          <label>Capacity <input id="restaurantCapacity" type="number" min="0" /></label>
          <label>Status Note <input id="restaurantNote" /></label>
        </div>
        <button class="btn" style="margin-top:12px" onclick="saveRestaurant()">Save Restaurant</button>
      </section>

      <section class="panel">
        <h2>Menu Items</h2>
        <div class="toolbar">
          <input id="menuSearch" placeholder="Search menu" oninput="renderMenu()" />
          <button class="btn small secondary" onclick="clearMenuForm()">New Item</button>
        </div>
        <div id="menuTable"></div>
        <p class="message" id="menuMessage"></p>
      </section>

      <section class="panel">
        <h2>Edit Menu Item</h2>
        <input id="menuId" type="hidden" />
        <div class="form-grid">
          <label>Name <input id="menuName" /></label>
          <label>Price <input id="menuPrice" type="number" min="0" /></label>
          <label>Restaurant <select id="menuRestaurant"></select></label>
          <label>Category
            <select id="menuCategory">
              <option value="starter">Starter</option>
              <option value="main">Main Course</option>
              <option value="drinks">Drinks</option>
              <option value="snacks">Snacks</option>
              <option value="desserts">Desserts</option>
            </select>
          </label>
          <label>Type
            <select id="menuType">
              <option value="veg">Vegetarian</option>
              <option value="non-veg">Non-Vegetarian</option>
            </select>
          </label>
          <label>Image / Emoji <input id="menuImage" /></label>
          <label class="full">Description <textarea id="menuDescription"></textarea></label>
        </div>
        <button class="btn" style="margin-top:12px" onclick="saveMenuItem()">Save Menu Item</button>
        <button class="btn danger" style="margin-top:12px" onclick="deleteMenuItem()">Delete</button>
      </section>

      <section class="panel">
        <h2>Employees</h2>
        <div id="staffTable"></div>
        <p class="message" id="staffMessage"></p>
      </section>

      <section class="panel">
        <h2>Add / Edit Employee</h2>
        <input id="staffId" type="hidden" />
        <div class="form-grid">
          <label>Name <input id="staffName" /></label>
          <label>Role
            <select id="staffRole">
              <option>Waiter</option>
              <option>Chef</option>
              <option>Counter Staff</option>
              <option>Delivery Staff</option>
              <option>Manager</option>
            </select>
          </label>
          <label>Restaurant <select id="staffRestaurant"></select></label>
          <label>Shift
            <select id="staffShift">
              <option>Morning</option>
              <option>Evening</option>
              <option>Night</option>
              <option>Flexible</option>
            </select>
          </label>
          <label>Email <input id="staffEmail" /></label>
          <label>Phone <input id="staffPhone" /></label>
          <label>Department <input id="staffDepartment" /></label>
          <label>Active
            <select id="staffActive">
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </label>
        </div>
        <button class="btn" style="margin-top:12px" onclick="saveStaff()">Save Employee</button>
        <button class="btn secondary" style="margin-top:12px" onclick="clearStaffForm()">New Employee</button>
        <button class="btn danger" style="margin-top:12px" onclick="deleteStaff()">Delete Employee</button>
      </section>
    </div>
  </main>

  <script src="../data.js"></script>
  <script src="../auth.js"></script>
  <script>
    if (!Auth.isAuthenticated() || Auth.getCurrentUser().role !== 'manager') {
      window.location.replace('../auth/login.html');
    }

    // Logout event listener - clean up state (Auth.logout() handles redirect)
    window.addEventListener('authLogout', (event) => {
      console.log('Manager operations page received logout event - Auth.logout() will handle redirect');
      // Auth.logout() already redirected, no need to redirect here
    });

    // Listen for storage changes (logout from another tab)
    window.addEventListener('storage', (event) => {
      if (event.key === 'campusFoodToken' && event.newValue === null) {
        console.log('Token cleared in another tab (manager operations page) - redirecting');
        // Use replace() to prevent back button loop
        window.location.replace('../auth/login.html');
      }
    });

    const API_BASE = 'https://studentdinee.onrender.com/api';
    const PRISMA_RESTAURANTS_URL = `${API_BASE}/prisma/restaurants`;

    let restaurants = [];
    let menuItems = [];
    let staff = [];

    const byId = id => document.getElementById(id);

    async function refreshAll() {
      try {
        const token = Auth.getToken();
        
        const [restaurantsRes, menuRes, staffRes] = await Promise.all([
          fetch(PRISMA_RESTAURANTS_URL),
          fetch('https://studentdinee.onrender.com/api/menu', {
            headers: { 'Authorization': `Bearer ${token}` }
          }),
          fetch('https://studentdinee.onrender.com/api/prisma/staff', {
            headers: { 'Authorization': `Bearer ${token}` }
          })
        ]);

        // Load restaurants from PostgreSQL
        if (restaurantsRes.ok) {
          const responseData = await restaurantsRes.json();
          restaurants = responseData.data || [];
          console.log("[Operations] ✓ Loaded restaurants from PostgreSQL", restaurants);
        } else {
          restaurants = [];
          console.warn("[Operations] ✗ Failed to load restaurants from PostgreSQL:", restaurantsRes.status);
        }
        
        menuItems = menuRes.ok ? (await menuRes.json()).data || [] : [];
        
        // Load staff from PostgreSQL  
        if (staffRes.ok) {
          const responseData = await staffRes.json();
          staff = responseData.data || [];
          console.log("[Operations] ✓ Loaded staff from PostgreSQL", staff);
        } else {
          staff = [];
          console.warn("[Operations] ✗ Failed to load staff from PostgreSQL:", staffRes.status);
        }
        
        console.log("[Operations] Data refreshed:", { restaurants: restaurants.length, menuItems: menuItems.length, staff: staff.length });
        
        renderRestaurantControls();
        renderRestaurants();
        renderMenu();
        renderStaff();
      } catch (error) {
        console.error("[Operations] Error refreshing data:", error);
        byId('restaurantMessage').textContent = 'Error loading restaurants: ' + error.message;
        byId('restaurantMessage').style.color = 'red';
      }
    }

    function restaurantOptions(value = '') {
      return restaurants.map(r => `<option value="${r.id}" ${r.id === value ? 'selected' : ''}>${r.name}</option>`).join('');
    }

    function renderRestaurantControls() {
      const selectEl = byId('restaurantSelect');
      const firstRestaurantId = restaurants.length > 0 ? restaurants[0].id : '';
      
      // Clear and repopulate dropdown
      selectEl.innerHTML = '';
      restaurants.forEach(r => {
        const option = document.createElement('option');
        option.value = r.id;
        option.textContent = r.name;
        if (r.id === firstRestaurantId) {
          option.selected = true;
        }
        selectEl.appendChild(option);
      });
      
      // Populate menu and staff restaurant selectors using restaurant.id (PostgreSQL primary key)
      byId('menuRestaurant').innerHTML = restaurantOptions();
      byId('staffRestaurant').innerHTML = restaurants.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
      
      // Fill form with first restaurant if available
      if (restaurants.length > 0) {
        fillRestaurantForm(restaurants[0]);
      } else {
        // Clear form if no restaurants
        ['restaurantName', 'restaurantCluster', 'restaurantPhone', 'restaurantEmail', 'restaurantAddress', 'restaurantCapacity', 'restaurantNote'].forEach(id => byId(id).value = '');
      }
    }

    function renderRestaurants() {
      byId('restaurantTable').innerHTML = `
        <table>
          <thead><tr><th>Name</th><th>Cluster</th><th>Status</th><th>Capacity</th></tr></thead>
          <tbody>${restaurants.map(r => `
            <tr onclick="selectRestaurant('${r.id}')">
              <td>${r.name}</td>
              <td>${r.cluster || ''}</td>
              <td><span class="status ${r.isOpen ? 'open' : 'closed'}">${r.isOpen ? 'Open' : 'Closed'}</span></td>
              <td>${r.capacity || 0}</td>
            </tr>
          `).join('')}</tbody>
        </table>`;
    }

    function selectRestaurant(id) {
      console.log('Selecting restaurant:', id);
      const restaurant = restaurants.find(r => r.id === id);
      if (!restaurant) {
        console.warn('Restaurant not found for ID:', id);
        return;
      }
      byId('restaurantSelect').value = id;
      fillRestaurantForm(restaurant);
    }

    // Add change event listener to restaurant select
    document.addEventListener('DOMContentLoaded', () => {
      byId('restaurantSelect').addEventListener('change', e => {
        console.log('Restaurant dropdown changed to:', e.target.value);
        selectRestaurant(e.target.value);
      });
    });
    
    // Also set up listener when script runs
    byId('restaurantSelect').addEventListener('change', e => {
      console.log('Restaurant dropdown changed to:', e.target.value);
      selectRestaurant(e.target.value);
    });

    function fillRestaurantForm(r) {
      if (!r) return;
      byId('restaurantName').value = r.name || '';
      byId('restaurantCluster').value = r.cluster || '';
      byId('restaurantPhone').value = r.phone || '';
      byId('restaurantEmail').value = r.email || '';
      byId('restaurantAddress').value = r.address || '';
      byId('restaurantCapacity').value = r.capacity || 0;
      byId('restaurantNote').value = r.statusNote || '';
    }

    async function saveRestaurant() {
      const id = byId('restaurantSelect').value;
      
      console.log('=== SAVE RESTAURANT ===');
      console.log('Restaurant ID:', id);
      
      if (!id) {
        console.warn("No restaurant selected");
        byId('restaurantMessage').textContent = 'Please select a restaurant';
        byId('restaurantMessage').style.color = 'red';
        return;
      }

      const payload = {
        name: byId('restaurantName').value,
        cluster: byId('restaurantCluster').value,
        phone: byId('restaurantPhone').value,
        email: byId('restaurantEmail').value,
        address: byId('restaurantAddress').value,
        capacity: Number(byId('restaurantCapacity').value) || 0,
        statusNote: byId('restaurantNote').value,
      };
      
      console.log("Restaurant payload:", payload);

      try {
        const token = Auth.getToken();
        if (!token) {
          throw new Error('Authentication token not found. Please login.');
        }

        console.log('Sending PUT request to /api/prisma/restaurants/' + id);
        const response = await fetch(`${PRISMA_RESTAURANTS_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        console.log('Response status:', response.status);

        if (!response.ok) {
          const errorData = await response.json();
          console.error('Server error:', errorData);
          throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        console.log('Response data:', result);
        
        if (result.success) {
          console.log("Restaurant saved to PostgreSQL");
          byId('restaurantMessage').textContent = (result.message || 'Restaurant saved successfully') + ' ✓';
          byId('restaurantMessage').style.color = 'green';
          
          // Verify the data was actually saved by checking the response
          if (result.data) {
            console.log('Verified data in response:');
            console.log('  - Name:', result.data.name);
            console.log('  - Cluster:', result.data.cluster);
            console.log('  - Phone:', result.data.phone);
          }
          
          // Wait a moment then refresh to show the updated values
          setTimeout(() => {
            console.log('Refreshing restaurant list...');
            refreshAll();
          }, 500);
        } else {
          console.warn("Save failed:", result.message);
          byId('restaurantMessage').textContent = result.message || 'Could not save restaurant';
          byId('restaurantMessage').style.color = 'red';
        }
      } catch (error) {
        console.error("✗ Failed to save restaurant", error);
        byId('restaurantMessage').textContent = 'Error: ' + error.message;
        byId('restaurantMessage').style.color = 'red';
        alert('Failed to save restaurant:\n' + error.message);
      }
    }

    async function toggleRestaurant() {
      const id = byId('restaurantSelect').value;
      const restaurant = restaurants.find(r => r.id === id);
      
      console.log('=== TOGGLE RESTAURANT ===');
      console.log('Restaurant ID:', id);

      if (!restaurant) {
        console.warn("Restaurant not found");
        byId('restaurantMessage').textContent = 'Restaurant not found';
        byId('restaurantMessage').style.color = 'red';
        return;
      }

      const newStatus = !restaurant.isOpen;
      console.log("Toggling restaurant status:", restaurant.isOpen, "→", newStatus);

      try {
        const token = Auth.getToken();
        if (!token) {
          throw new Error('Authentication token not found. Please login.');
        }

        const response = await fetch(`${PRISMA_RESTAURANTS_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isOpen: newStatus })
        });

        if (!response.ok) {
          const errorData = await response.json();
          console.error('Server error:', errorData);
          throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        console.log('Response data:', result);
        
        if (result.success) {
          console.log("Restaurant open/close status updated to:", newStatus);
          byId('restaurantMessage').textContent = 'Status updated to ' + (newStatus ? 'OPEN' : 'CLOSED') + ' ✓';
          byId('restaurantMessage').style.color = 'green';
          setTimeout(() => refreshAll(), 500);
        } else {
          console.error("Toggle failed:", result.message);
          byId('restaurantMessage').textContent = result.message || 'Could not update status';
          byId('restaurantMessage').style.color = 'red';
        }
      } catch (error) {
        console.error("✗ Failed to toggle restaurant status", error);
        byId('restaurantMessage').textContent = 'Error: ' + error.message;
        byId('restaurantMessage').style.color = 'red';
        alert('Failed to update status:\n' + error.message);
      }
    }

    async function createRestaurant() {
      const name = byId('restaurantName').value.trim();
      const cluster = byId('restaurantCluster').value.trim();
      if (!name || !cluster) {
        byId('restaurantMessage').textContent = 'Enter name and cluster in the form first';
        byId('restaurantMessage').style.color = 'red';
        return;
      }

      const payload = {
        restaurantId: 'REST' + Date.now(),
        name,
        cluster,
        phone: byId('restaurantPhone').value,
        email: byId('restaurantEmail').value,
        address: byId('restaurantAddress').value,
        capacity: Number(byId('restaurantCapacity').value) || 0,
        statusNote: byId('restaurantNote').value,
        isOpen: true,
      };

      try {
        console.log('POST /api/prisma/restaurants — create');
        console.log('Creating new restaurant:', name);
        const response = await fetch(PRISMA_RESTAURANTS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const result = await response.json();
        if (result.success) {
          console.log("Restaurant created in PostgreSQL:", result.data);
          byId('restaurantMessage').textContent = 'Restaurant created in PostgreSQL ✓';
          byId('restaurantMessage').style.color = 'green';
          await refreshAll();
          // Select the newly created restaurant
          if (result.data?.id) {
            console.log('Selecting newly created restaurant:', result.data.id);
            selectRestaurant(result.data.id);
          }
        } else {
          byId('restaurantMessage').textContent = result.message || 'Create failed';
          byId('restaurantMessage').style.color = 'red';
        }
      } catch (error) {
        console.error('Error creating restaurant:', error);
        byId('restaurantMessage').textContent = 'Error: ' + error.message;
        byId('restaurantMessage').style.color = 'red';
      }
    }

    async function deleteRestaurant() {
      const id = byId('restaurantSelect').value;
      if (!id) {
        byId('restaurantMessage').textContent = 'Select a restaurant to delete';
        byId('restaurantMessage').style.color = 'red';
        return;
      }
      if (!confirm('Delete this restaurant from PostgreSQL?')) return;

      try {
        console.log('DELETE /api/prisma/restaurants/' + id);
        const response = await fetch(`${PRISMA_RESTAURANTS_URL}/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          console.log("Restaurant deleted from PostgreSQL");
          byId('restaurantMessage').textContent = 'Restaurant deleted from PostgreSQL ✓';
          byId('restaurantMessage').style.color = 'green';
          await refreshAll();
        } else {
          byId('restaurantMessage').textContent = result.message || 'Delete failed';
          byId('restaurantMessage').style.color = 'red';
        }
      } catch (error) {
        console.error("Failed to delete restaurant:", error);
        byId('restaurantMessage').textContent = 'Error: ' + error.message;
        byId('restaurantMessage').style.color = 'red';
      }
    }

    function renderMenu() {
      const q = byId('menuSearch').value.trim().toLowerCase();
      const filtered = menuItems.filter(item => !q || item.name.toLowerCase().includes(q) || item.restaurantName.toLowerCase().includes(q));
      byId('menuTable').innerHTML = `
        <table>
          <thead><tr><th>Item</th><th>Restaurant</th><th>Price</th><th></th></tr></thead>
          <tbody>${filtered.map(item => `
            <tr>
              <td>${item.name}</td><td>${item.restaurantName}</td><td>₹${item.price}</td>
              <td><button class="btn small secondary" onclick="editMenu('${item.id}')">Edit</button></td>
            </tr>
          `).join('')}</tbody>
        </table>`;
    }

    function editMenu(id) {
      const item = menuItems.find(i => String(i.id) === String(id));
      byId('menuId').value = item.id;
      byId('menuName').value = item.name || '';
      byId('menuPrice').value = item.price || 0;
      byId('menuRestaurant').value = item.restaurantId || '';
      byId('menuCategory').value = item.category || 'main';
      byId('menuType').value = item.type || 'veg';
      byId('menuImage').value = item.image || '';
      byId('menuDescription').value = item.description || '';
    }

    function clearMenuForm() {
      ['menuId', 'menuName', 'menuPrice', 'menuImage', 'menuDescription'].forEach(id => byId(id).value = '');
      byId('menuCategory').value = 'main';
      byId('menuType').value = 'veg';
      byId('menuRestaurant').value = restaurants[0]?.id || '';
    }

    async function saveMenuItem() {
      const restaurant = restaurants.find(r => r.id === byId('menuRestaurant').value);
      const payload = {
        name: byId('menuName').value,
        price: Number(byId('menuPrice').value),
        restaurantId: restaurant?.id,
        restaurantName: restaurant?.name,
        category: byId('menuCategory').value,
        type: byId('menuType').value,
        image: byId('menuImage').value || '🍽️',
        description: byId('menuDescription').value,
      };
      const id = byId('menuId').value;
      const result = id ? await CampusFoodDB.updateMenuItem(id, payload) : await CampusFoodDB.addMenuItem(payload);
      byId('menuMessage').textContent = result.message || (result.success ? 'Saved' : 'Could not save');
      clearMenuForm();
      await refreshAll();
    }

    async function deleteMenuItem() {
      const id = byId('menuId').value;
      if (!id) return;
      const result = await CampusFoodDB.deleteMenuItem(id);
      byId('menuMessage').textContent = result.message || 'Deleted';
      clearMenuForm();
      await refreshAll();
    }

    function renderStaff() {
      console.log("[Operations] Rendering staff:", staff);
      byId('staffTable').innerHTML = `
        <table>
          <thead><tr><th>Name</th><th>Role</th><th>Restaurant</th><th>Shift</th><th>Status</th></tr></thead>
          <tbody>${staff.map(member => `
            <tr>
              <td>${member.name}</td>
              <td>${member.role}</td>
              <td>${member.restaurantId}</td>
              <td>${member.shift}</td>
              <td><span class="status ${member.isActive ? 'open' : 'closed'}">${member.isActive ? 'Active' : 'Inactive'}</span></td>
              <td><button class="btn small secondary" onclick="editStaff('${member.staffId}')">Edit</button></td>
            </tr>
          `).join('')}</tbody>
        </table>`;
    }

    function editStaff(staffId) {
      console.log("[Operations] Editing staff:", staffId);
      const member = staff.find(s => s.staffId === staffId);
      if (!member) {
        console.error("[Operations] Staff not found:", staffId);
        return;
      }
      byId('staffId').value = member.staffId;
      byId('staffName').value = member.name || '';
      byId('staffRole').value = member.role || 'Waiter';
      byId('staffRestaurant').value = member.restaurantId || '';
      byId('staffShift').value = member.shift || 'Morning';
      byId('staffEmail').value = member.email || '';
      byId('staffPhone').value = member.phone || '';
      byId('staffDepartment').value = member.department || '';
      byId('staffActive').value = String(member.isActive !== false);
    }

    function clearStaffForm() {
      console.log("[Operations] Clearing staff form");
      byId('staffId').value = '';
      byId('staffName').value = '';
      byId('staffEmail').value = '';
      byId('staffPhone').value = '';
      byId('staffDepartment').value = '';
      byId('staffRole').value = 'Waiter';
      byId('staffShift').value = 'Morning';
      byId('staffActive').value = 'true';
      // Set restaurant to first PostgreSQL restaurant ID (not name)
      byId('staffRestaurant').value = restaurants[0]?.id || '';
    }

    async function saveStaff() {
      console.log("[Operations] Saving staff");
      const staffId = byId('staffId').value;
      const payload = {
        name: byId('staffName').value,
        role: byId('staffRole').value,
        restaurantId: byId('staffRestaurant').value,
        shift: byId('staffShift').value,
        email: byId('staffEmail').value,
        phone: byId('staffPhone').value,
        isActive: byId('staffActive').value === 'true',
      };
      
      console.log("[Operations] Payload:", payload);
      
      let result;
      if (staffId) {
        console.log(`[Operations] Updating staff ${staffId}`);
        result = await CampusFoodDB.updateStaff(staffId, payload);
      } else {
        console.log("[Operations] Creating new staff");
        result = await CampusFoodDB.addStaff(payload);
      }
      
      console.log("[Operations] Save result:", result);
      byId('staffMessage').textContent = result.message || (result.success ? 'Saved' : 'Could not save');
      byId('staffMessage').style.color = result.success ? '#10b981' : '#ef4444';
      clearStaffForm();
      await refreshAll();
    }

    async function deleteStaff() {
      const staffId = byId('staffId').value;
      if (!staffId) {
        console.warn("[Operations] No staff ID selected for deletion");
        return;
      }
      console.log(`[Operations] Deleting staff ${staffId}`);
      const result = await CampusFoodDB.deleteStaff(staffId);
      console.log("[Operations] Delete result:", result);
      byId('staffMessage').textContent = result.message || 'Deleted';
      byId('staffMessage').style.color = result.success ? '#10b981' : '#ef4444';
      clearStaffForm();
      await refreshAll();
    }

    refreshAll();
  </script>
</body>
</html>
